services:
  - type: web
    name: pramaan-aicte-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HMAC_APAAR_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
